<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="black"/></marker></defs><g font-family="Arial, sans-serif" fill="black" stroke="none"><rect x="30" y="25" width="240" height="55" fill="white" stroke="black" stroke-width="1.6"/><text x="150" y="59" text-anchor="middle" font-size="19" font-weight="bold">GAME CLIENT</text><line x1="150" x2="150" y1="80" y2="1105" stroke="black" stroke-dasharray="7 7"/><rect x="380" y="25" width="240" height="55" fill="white" stroke="black" stroke-width="1.6"/><text x="500" y="59" text-anchor="middle" font-size="19" font-weight="bold">BACKEND API</text><line x1="500" x2="500" y1="80" y2="1105" stroke="black" stroke-dasharray="7 7"/><rect x="760" y="25" width="240" height="55" fill="white" stroke="black" stroke-width="1.6"/><text x="880" y="59" text-anchor="middle" font-size="19" font-weight="bold">GAME-CORE</text><line x1="880" x2="880" y1="80" y2="1105" stroke="black" stroke-dasharray="7 7"/><rect x="1150" y="25" width="240" height="55" fill="white" stroke="black" stroke-width="1.6"/><text x="1270" y="59" text-anchor="middle" font-size="19" font-weight="bold">POSTGRESQL</text><line x1="1270" x2="1270" y1="80" y2="1105" stroke="black" stroke-dasharray="7 7"/><rect x="355" y="260" width="1040" height="615" fill="none" stroke="black" stroke-width="1.5"/><rect x="356" y="261" width="610" height="32" fill="white"/><text x="370" y="284" font-size="17" font-weight="bold">TRANSACTION — state, action và reward cùng commit</text><line x1="150" y1="145" x2="500" y2="145" stroke="black" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="126.99999999999997" y="112" width="396.00000000000006" height="26" fill="white"/><text x="325" y="132" text-anchor="middle" font-size="17">1. action + clientActionId + expectedSequence</text><rect x="380" y="171" width="325" height="72" fill="white" stroke="black"/><text x="392" y="198" font-size="17"><tspan x="392" dy="0">2. Auth + ownership + format</tspan><tspan x="392" dy="25">Chỉ xử lý action của chính mình</tspan></text><line x1="500" y1="337" x2="1270" y2="337" stroke="black" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="629.8" y="304" width="510.40000000000003" height="26" fill="white"/><text x="885" y="324" text-anchor="middle" font-size="17">3. Khóa Battle; kiểm tra actionId / requestHash / sequence</text><line x1="1270" y1="405" x2="500" y2="405" stroke="black" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="744.2" y="372" width="281.6" height="26" fill="white"/><text x="885" y="392" text-anchor="middle" font-size="17">4. State + snapshot + RNG nội bộ</text><line x1="500" y1="475" x2="880" y2="475" stroke="black" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="575.6" y="442" width="228.8" height="26" fill="white"/><text x="690" y="462" text-anchor="middle" font-size="17">5. validate + reduceBattle</text><line x1="880" y1="542" x2="500" y2="542" stroke="black" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="571.2" y="509" width="237.60000000000002" height="26" fill="white"/><text x="690" y="529" text-anchor="middle" font-size="17">6. State mới + events + RNG</text><line x1="500" y1="611" x2="1270" y2="611" stroke="black" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="717.8" y="578" width="334.40000000000003" height="26" fill="white"/><text x="885" y="598" text-anchor="middle" font-size="17">7. Lưu state, sequence và BattleAction</text><line x1="500" y1="700" x2="1270" y2="700" stroke="black" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="651.8" y="667" width="466.40000000000003" height="26" fill="white"/><text x="885" y="687" text-anchor="middle" font-size="17">8. Nếu WON: grant → Gold/item/EXP → progress + ledger</text><line x1="500" y1="775" x2="1270" y2="775" stroke="black" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="845.4" y="742" width="79.2" height="26" fill="white"/><text x="885" y="762" text-anchor="middle" font-size="17">9. COMMIT</text><line x1="1270" y1="839" x2="500" y2="839" stroke="black" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="801.4" y="806" width="167.20000000000002" height="26" fill="white"/><text x="885" y="826" text-anchor="middle" font-size="17">10. Xác nhận commit</text><line x1="500" y1="950" x2="150" y2="950" stroke="black" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="166.6" y="917" width="316.8" height="26" fill="white"/><text x="325" y="937" text-anchor="middle" font-size="17">11. Events + public state + sequence</text><rect x="28" y="982" width="320" height="72" fill="white" stroke="black"/><text x="40" y="1009" font-size="17"><tspan x="40" dy="0">12. Animation → đồng bộ state</tspan><tspan x="40" dy="25">Mở input khi phase cho phép</tspan></text><rect x="610" y="950" width="790" height="97" fill="white" stroke="black"/><text x="622" y="977" font-size="17"><tspan x="622" dy="0">Nhánh khác: ID cũ + payload khớp → trả response đã lưu.</tspan><tspan x="622" dy="25">Sequence sai → 409; client tải lại state. Lỗi ghi → rollback.</tspan><tspan x="622" dy="25">Timeout → retry cùng ID. Seed/RNG nội bộ không trả ra client.</tspan></text></g></svg>