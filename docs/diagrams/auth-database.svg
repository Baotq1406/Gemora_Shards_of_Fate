<text x="48" y="990" font-size="22" fill="#0f172a" font-weight="700">Đọc quan hệ</text>
<text x="48" y="1026" font-size="18" fill="#334155" >Một User có 0 hoặc 1 PlayerProfile.</text>
<text x="48" y="1058" font-size="18" fill="#334155" >Một User có 0 hoặc 1 liên kết Google.</text>
<text x="48" y="1090" font-size="18" fill="#334155" >Một User có 0 hoặc nhiều AuthSession.</text>
<text x="48" y="1122" font-size="18" fill="#334155" >Xóa User: ba loại bản ghi con bị xóa theo.</text>
<text x="48" y="1180" font-size="20" fill="#0f172a" font-weight="700">AuthIdentity: các khóa UNIQUE ghép</text>
<text x="48" y="1216" font-size="18" fill="#334155" >UQ1 = (provider, providerSubject)</text>
<text x="48" y="1248" font-size="18" fill="#334155" >UQ2 = (userId, provider)</text>
<line x1="48" y1="1370" x2="1492" y2="1370" stroke="#cbd5e1"/>
<text x="48" y="1410" font-size="18" fill="#334155" >PK: khóa chính   •   FK: khóa ngoại   •   UQ: không trùng   •   NULL: cho phép chưa có giá trị</text>
<text x="48" y="1450" font-size="17" fill="#334155" >passwordHash và revokedAt cho phép NULL. AuthProvider hiện chỉ có GOOGLE. API auth chưa triển khai.</text>
